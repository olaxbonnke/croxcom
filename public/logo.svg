<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Yellow rounded card container -->
  <rect x="10" y="10" width="180" height="180" rx="32" fill="#FFE600" stroke="#000000" stroke-width="9" />
  
  <!-- Creature shape in black -->
  <g fill="#000000">
    <!-- Left head/ear upward extension -->
    <rect x="38" y="48" width="16" height="44" />
    <!-- Connector to body -->
    <rect x="38" y="76" width="34" height="16" />
    <!-- Main body -->
    <rect x="62" y="64" width="74" height="38" />
    <!-- Left leg -->
    <rect x="72" y="102" width="15" height="42" />
    <!-- Right leg -->
    <rect x="112" y="102" width="15" height="42" />
    <!-- Tail horizontal -->
    <rect x="136" y="76" width="26" height="16" />
    <!-- Tail vertical down -->
    <rect x="146" y="92" width="16" height="26" />
  </g>
  
  <!-- Eyes in white -->
  <g fill="#FFFFFF">
    <!-- Left eye (square) -->
    <rect x="78" y="78" width="9" height="9" rx="2" />
    <!-- Right eye (dash) -->
    <rect x="106" y="81" width="14" height="5" rx="2" />
  </g>
</svg>
